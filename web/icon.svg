<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14363b"/><stop offset="1" stop-color="#061114"/>
    </linearGradient>
    <linearGradient id="cu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb877"/><stop offset="1" stop-color="#d9752f"/>
    </linearGradient>
    <clipPath id="body"><path d="M114 92 L62 186 Q55 202 72 204 H184 Q201 202 194 186 L142 92 Z"/></clipPath>
    <radialGradient id="glow"><stop offset="0" stop-color="#7ff3ff" stop-opacity=".95"/><stop offset=".35" stop-color="#4ccae2" stop-opacity=".55"/><stop offset="1" stop-color="#4ccae2" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1.3" fill="#2a5b5f"/></pattern>
  </defs>
  <rect x="6" y="6" width="244" height="244" rx="58" fill="url(#bg)"/>
  <rect x="6" y="6" width="244" height="244" rx="58" fill="url(#dots)" opacity=".55"/>
  <rect x="7.5" y="7.5" width="241" height="241" rx="56.5" fill="none" stroke="#2f6a6b" stroke-width="3"/>
  <!-- liquid: solder-mask green with circuit traces -->
  <g clip-path="url(#body)">
    <path d="M40 146 Q92 132 128 146 T216 146 V220 H40 Z" fill="#0f4a45"/>
    <g fill="none" stroke="#3fd0a0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M76 190 H104 L120 172 H150"/>
      <path d="M96 204 V196 L110 182"/>
      <path d="M180 190 H160 L150 180"/>
    </g>
    <g fill="#0f4a45" stroke="#3fd0a0" stroke-width="5">
      <circle cx="76" cy="190" r="6"/><circle cx="180" cy="190" r="6"/>
    </g>
  </g>
  <!-- flask in copper -->
  <path d="M98 40 H158 M112 42 V94 L58 188 Q50 208 72 210 H184 Q206 208 198 188 L144 94 V42" fill="none" stroke="url(#cu)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- probe point glowing on the trace -->
  <circle cx="150" cy="172" r="30" fill="url(#glow)"/>
  <circle cx="150" cy="172" r="9" fill="#e9fdff"/>
  <!-- rising bubbles in the neck -->
  <circle cx="128" cy="118" r="6" fill="#4ccae2"/>
  <circle cx="122" cy="80" r="4.5" fill="#4ccae2" opacity=".75"/>
  <circle cx="134" cy="56" r="3.5" fill="#4ccae2" opacity=".5"/>
</svg>
