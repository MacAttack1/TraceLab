# Builds Trace Lab and publishes a GitHub release when you push a version tag:
#   git tag v1.2.0 && git push origin v1.2.0
# Installed copies of Trace Lab see the new release and offer to update.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test file-format parsers
        run: node test/parsers.test.mjs

      - name: Work out version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Build app and installer
        env:
          TRACELAB_FZ_KEY: ${{ secrets.TRACELAB_FZ_KEY }}
        run: bash build.sh "$VERSION" "$GITHUB_REPOSITORY"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: TraceLab-${{ env.VERSION }}
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Trace Lab $VERSION" \
            --generate-notes
